<style>
  :root{
    --ink:#241C14;
    --ink-soft:#6B5E4F;
    --paper:#FAF6EF;
    --surface:#FFFFFF;
    --line:#E7DECE;
    --marigold:#D9962C;
    --marigold-deep:#B87A1A;
    --teal:#1F5C52;
    --teal-soft:#E4F0ED;
    --maroon:#9A3B3B;
    --maroon-soft:#F7E7E4;
    --amber-soft:#FBEFD8;
    --shadow: 0 1px 2px rgba(36,28,20,.06), 0 6px 20px rgba(36,28,20,.06);
    --radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F3ECDF;
      --ink-soft:#C9BCA5;
      --paper:#1B1611;
      --surface:#241D16;
      --line:#3A2F23;
      --marigold:#E6A83A;
      --marigold-deep:#F0BC5E;
      --teal:#4FA593;
      --teal-soft:#1C2E2A;
      --maroon:#D98080;
      --maroon-soft:#3A2222;
      --amber-soft:#33280F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F3ECDF;
    --ink-soft:#C9BCA5;
    --paper:#1B1611;
    --surface:#241D16;
    --line:#3A2F23;
    --marigold:#E6A83A;
    --marigold-deep:#F0BC5E;
    --teal:#4FA593;
    --teal-soft:#1C2E2A;
    --maroon:#D98080;
    --maroon-soft:#3A2222;
    --amber-soft:#33280F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  html,body{ height:100%; overscroll-behavior-y:contain; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }
  button, .table-card, .item-card, .cat-tab, .rp-card, .staff-chip, .manage-row{ -webkit-touch-callout:none; }
  h1,h2,h3,.display{ font-family:'Fraunces',Georgia,serif; }
  #app{ max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  /* ---- Top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:40;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(155deg, var(--marigold), var(--marigold-deep));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:17px;
    flex-shrink:0;
  }
  .brand-text .name{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; line-height:1.1; }
  .brand-text .role{ font-size:11.5px; color:var(--ink-soft); letter-spacing:.02em; margin-top:1px;}
  .role-switch{
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:3px;
  }
  .role-switch button{
    border:none; background:transparent; padding:6px 12px; border-radius:999px;
    font-family:'Inter'; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    cursor:pointer;
  }
  .role-switch button.active{ background:var(--marigold); color:#fff; }

  main{ flex:1; padding:18px 18px calc(90px + env(safe-area-inset-bottom,0px)); }

  /* ---- Section headers ---- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .section-head h1{ font-size:23px; font-weight:600; margin:0; }
  .section-sub{ color:var(--ink-soft); font-size:13px; margin:2px 0 0; }

  /* ---- Table grid ---- */
  .table-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  .table-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 14px; text-align:left; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;
    transition:transform .12s ease;
  }
  .table-card:active{ transform:scale(.97); }
  .table-card .tno{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .table-card .tstat{ font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .table-card.empty .dot{ background:#B7ADA0; }
  .table-card.empty .tstat{ color:var(--ink-soft); }
  .table-card.running{ border-color:var(--teal); background:var(--teal-soft); }
  .table-card.running .dot{ background:var(--teal); }
  .table-card.running .tstat{ color:var(--teal); }
  .table-card.bill_ready{ border-color:var(--maroon); background:var(--maroon-soft); animation:pulseCard 1.8s ease-in-out infinite; }
  .table-card.bill_ready .dot{ background:var(--maroon); }
  .table-card.bill_ready .tstat{ color:var(--maroon); }
  @keyframes pulseCard{ 0%,100%{ box-shadow:var(--shadow);} 50%{ box-shadow:0 0 0 4px rgba(154,59,59,.22);} }
  .kitchen-badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; margin-top:4px; }
  .kitchen-badge.pending{ background:var(--amber-soft); color:var(--marigold-deep); }
  .kitchen-badge.ready{ background:var(--teal-soft); color:var(--teal); }
  .kitchen-order-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .kitchen-order-card.ready{ opacity:.55; }
  .kitchen-order-card .ko-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .kitchen-order-card .ko-tno{ font-family:'Fraunces',serif; font-size:20px; font-weight:700; }
  .kitchen-order-card .ko-item{ font-size:14px; padding:4px 0; display:flex; justify-content:space-between; }
  .dash-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
  .dash-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
  .dash-card .dv{ font-family:'Fraunces',serif; font-size:26px; font-weight:700; }
  .dash-card .dl{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .dash-card.green .dv{ color:var(--teal); }
  .dash-card.red .dv{ color:var(--maroon); }
  .table-card .meta{ font-size:11.5px; color:var(--ink-soft); }

  /* ---- Toast / notification banner ---- */
  .banner{
    position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 4px);
    z-index:80; display:flex; justify-content:center; pointer-events:none;
  }
  .banner-inner{
    pointer-events:auto; max-width:560px; width:calc(100% - 32px);
    background:var(--teal); color:#fff; padding:12px 16px; border-radius:12px;
    display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(0,0,0,.25);
    font-size:13.5px; font-weight:600; transform:translateY(-140%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .banner-inner.show{ transform:translateY(0); }

  /* ---- Waiter: category tabs & search ---- */
  .search-row{ display:flex; gap:8px; margin-bottom:12px; }
  .search-row input{
    flex:1; border:1px solid var(--line); background:var(--surface); border-radius:12px;
    padding:12px 14px; font-size:16px; color:var(--ink); font-family:'Inter';
  }
  .search-row input:focus{ outline:2px solid var(--marigold); outline-offset:1px; }
  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; scrollbar-width:none; }
  .cat-tabs::-webkit-scrollbar{ display:none; }
  .cat-tab{
    flex-shrink:0; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .cat-tab.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .item-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px;
    display:flex; flex-direction:column; gap:6px; position:relative; cursor:pointer; box-shadow:var(--shadow);
    min-height:86px; justify-content:space-between;

  /* ---------------- Turso HTTP client ---------------- */
  function httpUrlFrom(raw){
    if(!raw) return "";
    return raw.replace(/^libsql:\/\//, "https://").replace(/\/+$/,"") + "/v2/pipeline";
  }
  function toTypedArg(v){
    if(v === null || v === undefined) return { type:"null" };
    if(typeof v === "number") return Number.isInteger(v) ? { type:"integer", value:String(v) } : { type:"float", value:v };
    if(typeof v === "boolean") return { type:"integer", value: v ? "1":"0" };
    return { type:"text", value:String(v) };
  }
  function fromTypedValue(cell){
    if(!cell || cell.type === "null") return null;
    if(cell.type === "integer" || cell.type === "float") return Number(cell.value);
    if(cell.type === "text") return cell.value;
    if(cell.type === "blob") return cell.base64;
    return cell.value;
  }

  let TURSO_URL = TURSO_URL_RAW || localStorage.getItem("nt_turso_url") || "";
  let TURSO_TOKEN = TURSO_AUTH_TOKEN || localStorage.getItem("nt_turso_token") || "";

  async function tursoExec(sql, args){
    const endpoint = httpUrlFrom(TURSO_URL);
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Authorization": "Bearer " + TURSO_TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({
        requests: [
          { type:"execute", stmt: { sql, args: (args||[]).map(toTypedArg) } },
          { type:"close" }
        ]
      })
    });
    if(!res.ok){
      const txt = await res.text().catch(()=> "");
      throw new Error("Turso HTTP " + res.status + ": " + txt.slice(0,200));
    }
    const data = await res.json();
    const first = data.results[0];
    if(first.type === "error") throw new Error(first.error && first.error.message || "Turso query failed");
    const result = first.response.result;
    const cols = (result.cols||[]).map(c=>c.name);
    const rows = (result.rows||[]).map(row=>{
      const obj = {};
      row.forEach((cell,i)=>{ obj[cols[i]] = fromTypedValue(cell); });
      return obj;
    });
    return { rows, lastInsertRowid: result.last_insert_rowid, affectedRowCount: result.affected_row_count };
  }

  async function ensureSchema(){
    const statements = [

      )`,
      `CREATE TABLE IF NOT EXISTS settings (

      )`,
      `CREATE TABLE IF NOT EXISTS sales_log (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        table_number INTEGER,
        subtotal INTEGER,
        cgst REAL,
        sgst REAL,
        total INTEGER,
        paid_at INTEGER
      )`,
      `CREATE INDEX IF NOT EXISTS idx_order_items_table ON order_items(table_id)`,
      `CREATE INDEX IF NOT EXISTS idx_menu_items_category ON menu_items(category)`,
      `CREATE INDEX IF NOT EXISTS idx_sales_log_paid_at ON sales_log(paid_at)`,
    ];
    for(const sql of statements){ await tursoExec(sql, []); }
    // Add kitchen_status column if this database was created before this feature existed.
    try{ await tursoExec("ALTER TABLE restaurant_tables ADD COLUMN kitchen_status TEXT DEFAULT 'none'", []); }
    catch(e){ /* already exists — fine */ }

    const defaults = [
      ["hotel_name", HOTEL.name], ["hotel_addr", HOTEL.addr], ["hotel_gstin", HOTEL.gstin],
      ["gst_enabled", "1"],
    ];
    for(const [k,v] of defaults){
      await tursoExec("INSERT OR IGNORE INTO settings (key, value) VALUES (?, ?)", [k, v]);
    }
    const acctCount = await tursoExec("SELECT COUNT(*) as c FROM accounts", []);
    if(acctCount.rows[0].c === 0){
      await tursoExec("INSERT INTO accounts (username, password, role, display_name) VALUES (?, ?, 'admin', 'Admin')",
        [DEFAULT_ADMIN.username, DEFAULT_ADMIN.password]);
    }
  }

  let tables = {};

  /* ---------------- Connection setup screen ---------------- */
  function renderSetup(err){

        <div class="field"><label>Database URL</label><input type="text" id="setupUrl" placeholder="libsql://your-db-name.turso.io" value="${(TURSO_URL||"").replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>Auth Token</label><input type="text" id="setupToken" placeholder="paste your token here" value="${(TURSO_TOKEN||"").replace(/"/g,'&quot;')}"></div>
        <button class="btn primary" id="setupConnect" style="width:100%;">Connect</button>

    $("#setupConnect").onclick = async ()=>{

  /* ---------------- Data loaders ---------------- */
  async function loadTables(){
    const t = await tursoExec("SELECT * FROM restaurant_tables ORDER BY number", []);
    const items = await tursoExec(`
      SELECT oi.table_id, oi.qty, mi.id as menu_item_id, mi.name, mi.price
      FROM order_items oi JOIN menu_items mi ON mi.id = oi.menu_item_id
    `, []);
    const cartByTableId = {};
    for(const row of items.rows){
      (cartByTableId[row.table_id] ||= []).push({ id: row.menu_item_id, name: row.name, price: row.price, qty: row.qty });
    }
    const next = {};
    for(const row of t.rows){
      next[row.number] = {
        id: row.id, number: row.number, status: row.status, updatedAt: row.updated_at,
        kitchenStatus: row.kitchen_status || "none",
        cart: cartByTableId[row.id] || []
      };
    }
    return next;
  }
  async function loadMenu(){
    const r = await tursoExec("SELECT * FROM menu_items ORDER BY category, name", []);
    return r.rows.map(i=> ({ ...i, popular: !!i.popular }));
  }
  async function loadAccounts(){
    const r = await tursoExec("SELECT * FROM accounts ORDER BY role DESC, username", []);
    return r.rows;
  }
  async function loadTodaySales(){
    const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
    const r = await tursoExec("SELECT COUNT(*) as cnt, COALESCE(SUM(total),0) as revenue FROM sales_log WHERE paid_at >= ?", [startOfDay.getTime()]);
    return { count: r.rows[0].cnt, revenue: r.rows[0].revenue };
  }

  async function refreshAll(){
    try{
      const [t, m, a] = await Promise.all([loadTables(), loadMenu(), loadAccounts(), loadSettings()]);
      const prevReadyKeys = new Set(Object.values(tables).filter(x=>x.status==="bill_ready").map(x=>x.number+"@"+x.updatedAt));
      const prevKitchenPending = new Set(Object.values(tables).filter(x=>x.kitchenStatus==="pending").map(x=>x.number+"@"+x.updatedAt));
      const prevKitchenReady = new Set(Object.values(tables).filter(x=>x.kitchenStatus==="ready").map(x=>x.number+"@"+x.updatedAt));
      tables = t; menuItems = m; accounts = a;
      if(!activeCat || !categories().includes(activeCat)) activeCat = categories()[0] || null;
      if(window.__firstLoadDone){
        Object.values(tables).forEach(x=>{
          const k = x.number+"@"+x.updatedAt;
          if(session && session.role==="admin" && x.status==="bill_ready" && !prevReadyKeys.has(k)){
            showBanner("Table "+x.number+" — Bill Ready 🔴");
          }
          if(session && session.role==="kitchen" && x.kitchenStatus==="pending" && !prevKitchenPending.has(k)){
            showBanner("New order — Table "+x.number);
          }
          if(session && session.role==="user" && x.kitchenStatus==="ready" && !prevKitchenReady.has(k)){
            showBanner("Table "+x.number+" — food ready to serve! 🍽️");
          }
        });
      }
      window.__firstLoadDone = true;
      connected = true; connectError = null;
      renderIfSafe();
    }catch(e){
      connectError = e.message || String(e);
      connected = false;
      render();
    }
  }

  function renderIfSafe(){
    const activeTag = document.activeElement && document.activeElement.tagName;
    const typing = activeTag === "INPUT" || activeTag === "TEXTAREA" || activeTag === "SELECT";
    const sheetOpen = $$(".sheet-overlay.show").length > 0;
    if(typing || sheetOpen) return;
    render();
  }

  async function boot(){
    if(!TURSO_URL || !TURSO_TOKEN){ renderSetup(null); return; }
    try{
      await ensureSchema();
      await refreshAll();
      if(pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(refreshAll, POLL_MS);
    }catch(e){
      renderSetup("Could not connect: " + (e.message||e));
    }
  }

  /* ---------------- Banner ---------------- */
  let bannerTimer=null;
  function showBanner(text){
    const el = $("#bannerInner");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(()=> el.classList.remove("show"), 3200);
  }

  /* ---------------- Login / Logout ---------------- */
  function roleDisplayName(r){ return r==="admin" ? "Admin" : r==="kitchen" ? "Kitchen" : "User"; }
  function updateTopbarForSession(){
    if(session){
      $("#roleSwitch").style.display = "flex";
      $("#roleLabel").textContent = session.displayName + " · " + roleDisplayName(session.role);
    } else {
      $("#roleSwitch").style.display = "none";
      $("#roleLabel").textContent = "Order & Billing";
    }
  }
  $("#logoutBtn").addEventListener("click", ()=>{
    session = null;
    localStorage.removeItem("nt_session");
    currentTableId = null; adminTab = "dashboard";
    updateTopbarForSession();
    render();
  });

  function renderLogin(err){
    $("#roleSwitch").style.display = "none";
    main.innerHTML = `
      <div class="role-pick">
        <div class="section-head" style="margin-bottom:0;">
          <div><h1>Sign in</h1><p class="section-sub">Enter your username and password</p></div>
        </div>
        ${err ? `<div style="background:var(--maroon-soft);color:var(--maroon);padding:12px 14px;border-radius:10px;font-size:13px;">${err}</div>` : ""}
        <div class="field"><label>Username</label><input type="text" id="loginUser" autocapitalize="off" autocomplete="off"></div>
        <div class="field"><label>Password</label><input type="password" id="loginPass" autocomplete="off"></div>
        <button class="btn primary" id="loginSubmit" style="width:100%;">Sign in</button>
      </div>`;
    const submit = async ()=>{
      const u = $("#loginUser").value.trim();
      const p = $("#loginPass").value;
      if(!u || !p){ renderLogin("Please enter both username and password."); return; }
      try{
        const r = await tursoExec("SELECT * FROM accounts WHERE username = ?", [u]);
        if(!r.rows.length || r.rows[0].password !== p){ renderLogin("Incorrect username or password."); return; }
        const acct = r.rows[0];
        session = { id: acct.id, username: acct.username, role: acct.role, displayName: acct.display_name || acct.username };
        localStorage.setItem("nt_session", JSON.stringify(session));
        currentTableId = null; adminTab = "dashboard";
        updateTopbarForSession();
        render();
      }catch(e){
        renderLogin("Could not sign in: " + (e.message||e));
      }
    };
    $("#loginSubmit").onclick = submit;
    $("#loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
  }

  /* ---------------- Render router ---------------- */
  function render(){
    removeDock(); removeFab();
    if(!TURSO_URL || !TURSO_TOKEN){ renderSetup(null); return; }
    if(!connected){ renderSetup(connectError ? ("Could not connect: "+connectError) : null); return; }
    if(!session){ renderLogin(null); return; }
    updateTopbarForSession();
    if(session.role === "user"){
      if(currentTableId) renderWaiterTableDetail(currentTableId);
      else renderWaiterTableGrid();
    } else if(session.role === "kitchen"){
      renderKitchenView();
    } else {
      renderAdmin();
    }
  }
  function removeDock(){ const d=document.getElementById("waiterDock"); if(d) d.remove(); }
  function removeFab(){ const f=document.getElementById("fabBtn"); if(f) f.remove(); }

  /* ---------------- Shared helpers ---------------- */
  function statusLabel(s){ return s==="empty" ? "Empty" : s==="running" ? "Order running" : "Bill ready"; }
  function cartTotal(cart){ return (cart||[]).reduce((s,i)=> s + i.price*i.qty, 0); }
  function cartCount(cart){ return (cart||[]).reduce((s,i)=> s + i.qty, 0); }
  function kitchenBadge(t){
    if(t.kitchenStatus === "pending") return `<div class="kitchen-badge pending">🍳 Preparing</div>`;
    if(t.kitchenStatus === "ready") return `<div class="kitchen-badge ready">✅ Ready to serve</div>`;
    return "";
  }

  /* ---------------- User: table grid ---------------- */

    const list = Object.values(tables).sort((a,b)=>a.number-b.number);

      <div class="section-head">
        <div><h1>Tables</h1><p class="section-sub">Tap a table to take or edit its order</p></div>
      </div>
      <div class="table-grid">
        ${list.map(t=>`
          <button class="table-card ${t.status}" data-t="${t.number}">
            <div class="tno">${t.number}</div>
            <div class="tstat"><span class="dot"></span>${statusLabel(t.status)}</div>
            ${t.status!=="empty" ? `<div class="meta">${cartCount(t.cart)} items · ${money(cartTotal(t.cart))}</div>` : `<div class="meta">Tap to start order</div>`}
            ${kitchenBadge(t)}
          </button>`).join("") || `<div class="empty-state">No tables yet. Ask Admin to add one.</div>`}
      </div>`;
    $$(".table-card").forEach(el=>{
      el.onclick = ()=>{ currentTableId = Number(el.dataset.t); searchQ=""; activeCat = categories()[0]||null; render(); };
    });

  /* ---------------- User: table detail ---------------- */
  function renderWaiterTableDetail(tno){
    const t = tables[tno];
    if(!t){ currentTableId=null; render(); return; }
    let items;
    if(searchQ.trim()){
      const q = searchQ.trim().toLowerCase();
      items = menuItems.filter(i=> i.name.toLowerCase().includes(q));
    } else if(activeCat === "Popular"){
      items = menuItems.filter(i=> i.popular);
    } else {
      items = menuItems.filter(i=> i.category === activeCat);
    }
    const cart = t.cart || [];
    const qtyOf = id => { const c = cart.find(c=>c.id===id); return c? c.qty:0; };
    const cats = categories();

    main.innerHTML = `
      <div class="section-head">
        <div>
          <button class="link-btn" id="backToGrid">← All tables</button>
          <h1 style="margin-top:6px;">Table ${t.number}</h1>
        </div>
      </div>
      ${t.kitchenStatus==="ready" ? `
      <div class="manage-row" style="border-color:var(--teal); background:var(--teal-soft); margin-bottom:14px;">
        <div class="mr-main"><div class="mr-title">🍽️ Food ready — go serve!</div></div>
        <button class="btn teal small" id="markServedBtn">Served</button>
      </div>` : ""}
      ${t.kitchenStatus==="pending" ? `
      <div class="manage-row" style="margin-bottom:14px;">
        <div class="mr-main"><div class="mr-title">🍳 Kitchen is preparing this order</div></div>
      </div>` : ""}
      <div class="search-row"><input id="searchInput" placeholder="Search item… e.g. Paneer" value="${searchQ.replace(/"/g,'&quot;')}"></div>
      <div class="cat-tabs" id="catTabs">
        <button class="cat-tab ${activeCat==='Popular'&&!searchQ?'active':''}" data-c="Popular">⭐ Popular</button>
        ${cats.map(c=>`<button class="cat-tab ${activeCat===c&&!searchQ?'active':''}" data-c="${c}">${c}</button>`).join("")}
      </div>
      <div class="item-grid" id="itemGrid">
        ${items.map(i=>`
          <div class="item-card ${qtyOf(i.id)>0?'has-qty':''}" data-i="${i.id}">
            ${i.popular?'<div class="pop-badge">Popular</div>':''}
            <div class="iname">${i.name}</div>
            <div class="iprice">${money(i.price)}</div>
            ${qtyOf(i.id)>0?`<div class="qty-pill">${qtyOf(i.id)}</div>`:''}
          </div>`).join("") || `<div class="empty-state" style="grid-column:1/-1;">No items match.</div>`}
      </div>`;

    $("#backToGrid").onclick = ()=>{ currentTableId=null; render(); };
    $("#searchInput").oninput = (e)=>{ searchQ = e.target.value; render(); };
    $$("#catTabs .cat-tab").forEach(b=> b.onclick = ()=>{ activeCat=b.dataset.c; searchQ=""; render(); });
    $$("#itemGrid .item-card").forEach(el=>{
      el.onclick = ()=> addToCart(tno, el.dataset.i, 1);
    });
    const msb = $("#markServedBtn");
    if(msb) msb.onclick = async ()=>{ await tursoExec("UPDATE restaurant_tables SET kitchen_status='none' WHERE id=?", [t.id]); await refreshAll(); };

    renderCartDock(tno);
  }

  function renderCartDock(tno){
    const t = tables[tno];
    const cart = t.cart || [];
    const total = cartTotal(cart);
    const count = cartCount(cart);
    removeDock();
    const dock = document.createElement("div");
    dock.className = "cart-dock";
    dock.id = "waiterDock";
    dock.innerHTML = `
      <div class="cart-summary" id="openCart">
        <div class="csum-left">${count} item${count!==1?'s':''} in order</div>
        <div class="csum-total">${money(total)}</div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="sendKitchen" ${count===0?'disabled':''}>Send to Kitchen</button>
        <button class="btn teal" id="tableDone" ${count===0?'disabled':''}>Table Done</button>
      </div>`;
    document.body.appendChild(dock);
    $("#openCart").onclick = ()=> openCartSheet(tno);
    $("#sendKitchen").onclick = async ()=>{
      await tursoExec("UPDATE restaurant_tables SET status='running', kitchen_status='pending', updated_at=? WHERE id=?", [Date.now(), t.id]);
      showBanner("Order sent to kitchen — Table "+t.number);
      await refreshAll();
    };
    $("#tableDone").onclick = async ()=>{
      await setTableStatus(tno, "bill_ready");
      showBanner("Table "+t.number+" marked done — bill will show on Admin");
      currentTableId = null;
      render();
    };
  }

  /* ---------------- Write operations (SQL) ---------------- */
  async function addToCart(tno, menuItemId, delta){
    const t = tables[tno];
    const existing = await tursoExec("SELECT * FROM order_items WHERE table_id = ? AND menu_item_id = ?", [t.id, menuItemId]);
    if(existing.rows.length){
      const newQty = existing.rows[0].qty + delta;
      if(newQty <= 0) await tursoExec("DELETE FROM order_items WHERE id = ?", [existing.rows[0].id]);
      else await tursoExec("UPDATE order_items SET qty = ? WHERE id = ?", [newQty, existing.rows[0].id]);
    } else if(delta > 0){
      await tursoExec("INSERT INTO order_items (table_id, menu_item_id, qty) VALUES (?, ?, ?)", [t.id, menuItemId, delta]);
    }
    const newStatus = t.status === "empty" ? "running" : t.status;
    await tursoExec("UPDATE restaurant_tables SET status=?, updated_at=? WHERE id=?", [newStatus, Date.now(), t.id]);
    await refreshAll();
  }

  async function setTableStatus(tno, status){
    const t = tables[tno];
    if(status === "empty"){
      await tursoExec("DELETE FROM order_items WHERE table_id = ?", [t.id]);
      await tursoExec("UPDATE restaurant_tables SET status=?, kitchen_status='none', updated_at=? WHERE id=?", [status, Date.now(), t.id]);
    } else {
      await tursoExec("UPDATE restaurant_tables SET status=?, updated_at=? WHERE id=?", [status, Date.now(), t.id]);
    }
    await refreshAll();
  }

  function openCartSheet(tno){
    const t = tables[tno];
    $("#cartTableNo").textContent = t.number;
    $("#cartLines").innerHTML = (t.cart||[]).map(c=>`
      <div class="cart-line" data-i="${c.id}">
        <div>
          <div class="cl-name">${c.name}</div>
          <div class="cl-price">${money(c.price)} each</div>
        </div>
        <div class="stepper">
          <button data-d="-1">−</button>
          <div class="qv">${c.qty}</div>
          <button data-d="1">+</button>
        </div>
      </div>`).join("") || `<div class="empty-state">Cart is empty</div>`;
    $$("#cartLines .stepper button").forEach(b=>{
      b.onclick = ()=> addToCart(tno, b.closest(".cart-line").dataset.i, Number(b.dataset.d));
    });
    $("#cartOverlay").classList.add("show");
  }
  $("#closeCart").onclick = ()=> $("#cartOverlay").classList.remove("show");
  $("#cartOverlay").addEventListener("click",(e)=>{ if(e.target.id==="cartOverlay") $("#cartOverlay").classList.remove("show"); });

  /* ================= KITCHEN ================= */
  function renderKitchenView(){
    const list = Object.values(tables)
      .filter(t=> t.kitchenStatus==="pending" || t.kitchenStatus==="ready")
      .sort((a,b)=> (a.kitchenStatus===b.kitchenStatus ? a.number-b.number : (a.kitchenStatus==="pending"?-1:1)));
    main.innerHTML = `
      <div class="section-head">
        <div><h1>Kitchen Orders</h1><p class="section-sub">${list.filter(t=>t.kitchenStatus==="pending").length} order(s) waiting</p></div>
      </div>
      <div id="kitchenList">
        ${list.map(t=>`
          <div class="kitchen-order-card ${t.kitchenStatus==='ready'?'ready':''}">
            <div class="ko-head">
              <div class="ko-tno">Table ${t.number}</div>
              ${t.kitchenStatus==='pending' ? `<button class="btn teal small" data-ready="${t.number}">Mark Ready</button>` : `<span class="kitchen-badge ready">✅ Ready</span>`}
            </div>
            ${(t.cart||[]).map(c=>`<div class="ko-item"><span>${c.name}</span><span>× ${c.qty}</span></div>`).join("")}
          </div>`).join("") || `<div class="empty-state"><div class="em-icon">🍽️</div>No orders waiting right now.</div>`}
      </div>`;
    $$("#kitchenList [data-ready]").forEach(b=>{
      b.onclick = async ()=>{
        const n = Number(b.dataset.ready);
        const t = tables[n];
        await tursoExec("UPDATE restaurant_tables SET kitchen_status='ready' WHERE id=?", [t.id]);
        showBanner("Table "+n+" marked ready");
        await refreshAll();
      };
    });
  }

  /* ================= ADMIN ================= */

    main.innerHTML = `
      <div class="subnav" id="adminSubnav">
        <button data-tab="dashboard" class="${adminTab==='dashboard'?'active':''}">Dashboard</button>
        <button data-tab="tables" class="${adminTab==='tables'?'active':''}">Tables</button>
        <button data-tab="menu" class="${adminTab==='menu'?'active':''}">Menu</button>
        <button data-tab="staff" class="${adminTab==='staff'?'active':''}">Users</button>
        <button data-tab="settings" class="${adminTab==='settings'?'active':''}">Settings</button>
      </div>
      <div id="adminBody"></div>`;
    $$("#adminSubnav button").forEach(b=> b.onclick = ()=>{ adminTab=b.dataset.tab; render(); });
    if(adminTab==="dashboard") renderAdminDashboard();
    else if(adminTab==="tables") renderAdminTables();
    else if(adminTab==="menu") renderAdminMenu();
    else if(adminTab==="staff") renderAdminStaff();
    else renderAdminSettings();
  }

        <div><h1 style="font-size:20px;">Dashboard</h1><p class="section-sub">Live snapshot of the restaurant right now</p></div>
      </div>
      <div class="dash-grid" id="dashGrid">
        <div class="dash-card"><div class="dv">…</div><div class="dl">Today's Sales</div></div>
        <div class="dash-card"><div class="dv">…</div><div class="dl">Bills Today</div></div>
        <div class="dash-card green"><div class="dv">${running}</div><div class="dl">Tables Running 🟢</div></div>
        <div class="dash-card red"><div class="dv">${billReady}</div><div class="dl">Bills Waiting 🔴</div></div>

        if(t.status === "empty"){ showBanner("Table "+n+" is empty"); return; }
        openBillSheet(n);
      };
    });
    $("#openTableMgmt").onclick = openTableMgmt;
  }

  function openTableMgmt(){
    renderTableMgmtList();
    $("#tableMgmtOverlay").classList.add("show");
  }
  function renderTableMgmtList(){
    const list = Object.values(tables).sort((a,b)=>a.number-b.number);
    $("#tableMgmtList").innerHTML = list.map(t=>`
      <div class="manage-row">
        <div class="mr-main"><div class="mr-title">Table ${t.number}</div><div class="mr-sub">${statusLabel(t.status)}</div></div>
        <div class="mr-actions"><button class="icon-btn danger" data-remove="${t.number}" ${t.status!=='empty'?'disabled title="Table must be empty to remove"':''}>✕</button></div>
      </div>`).join("") || `<div class="empty-state">No tables yet.</div>`;
    $$("#tableMgmtList [data-remove]").forEach(b=>{
      b.onclick = async ()=>{
        const n = Number(b.dataset.remove);
        const t = tables[n];
        await tursoExec("DELETE FROM order_items WHERE table_id = ?", [t.id]);
        await tursoExec("DELETE FROM restaurant_tables WHERE id = ?", [t.id]);
        showBanner("Table "+n+" removed");
        await refreshAll();
        renderTableMgmtList();
      };
    });
  }
  $("#closeTableMgmt").onclick = ()=> $("#tableMgmtOverlay").classList.remove("show");
  $("#tableMgmtOverlay").addEventListener("click",(e)=>{ if(e.target.id==="tableMgmtOverlay") $("#tableMgmtOverlay").classList.remove("show"); });
  $("#addTableBtn").onclick = async ()=>{
    try{
      const maxRes = await tursoExec("SELECT COALESCE(MAX(number),0) as maxn FROM restaurant_tables", []);
      let next = (maxRes.rows[0].maxn || 0) + 1;
      try{
        await tursoExec("INSERT INTO restaurant_tables (number, status, kitchen_status, updated_at) VALUES (?, 'empty', 'none', ?)", [next, Date.now()]);
      }catch(e){
        next += 1;
        await tursoExec("INSERT INTO restaurant_tables (number, status, kitchen_status, updated_at) VALUES (?, 'empty', 'none', ?)", [next, Date.now()]);
      }
      showBanner("Table "+next+" added");
      await refreshAll();
      renderTableMgmtList();
    }catch(e){
      showBanner("Could not add table: " + (e.message||e));
    }
  };

  function computeBill(cart){
    const subtotal = cartTotal(cart);
    if(!GST.enabled) return { subtotal, cgst:0, sgst:0, total: Math.round(subtotal) };
    const cgst = +(subtotal*GST.cgst/100).toFixed(2);
    const sgst = +(subtotal*GST.sgst/100).toFixed(2);
    const total = Math.round(subtotal+cgst+sgst);
    return {subtotal,cgst,sgst,total};
  }

  function openBillSheet(tno){
    const t = tables[tno];
    const bill = computeBill(t.cart||[]);
    $("#billTableNo").textContent = t.number;
    $("#billBox").innerHTML = `
      <div class="bill-head">
        <div class="hname">${HOTEL.name}</div>
        <div class="hmeta">${HOTEL.addr}${GST.enabled && HOTEL.gstin ? `<br>GSTIN: ${HOTEL.gstin}` : ""}</div>
      </div>
      <div class="bill-div"></div>
      <div style="font-size:12px; color:var(--ink-soft); margin-bottom:4px;">Table ${t.number} · ${new Date().toLocaleString("en-IN")}</div>
      ${(t.cart||[]).map(c=>`<div class="bill-row"><span>${c.qty}× ${c.name}</span><span>${money(c.price*c.qty)}</span></div>`).join("")}
      <div class="bill-div"></div>
      ${GST.enabled ? `
      <div class="bill-row"><span>Subtotal</span><span>${money(bill.subtotal)}</span></div>
      <div class="bill-row"><span>CGST (${GST.cgst}%)</span><span>${money(bill.cgst)}</span></div>
      <div class="bill-row"><span>SGST (${GST.sgst}%)</span><span>${money(bill.sgst)}</span></div>` : ""}
      <div class="bill-row total"><span>Total</span><span>${money(bill.total)}</span></div>`;

    $("#printBillBtn").onclick = ()=> printBill(t, bill);
    $("#markPaidBtn").onclick = async ()=>{
      await tursoExec("INSERT INTO sales_log (table_number, subtotal, cgst, sgst, total, paid_at) VALUES (?, ?, ?, ?, ?, ?)",
        [t.number, bill.subtotal, bill.cgst, bill.sgst, bill.total, Date.now()]);
      await setTableStatus(tno, "empty");
      $("#billOverlay").classList.remove("show");
      showBanner("Table "+t.number+" cleared for next guest");
    };
    $("#billOverlay").classList.add("show");
  }
  $("#closeBill").onclick = ()=> $("#billOverlay").classList.remove("show");
  $("#billOverlay").addEventListener("click",(e)=>{ if(e.target.id==="billOverlay") $("#billOverlay").classList.remove("show"); });

  function printBill(t, bill){
    const el = document.getElementById("printReceipt");
    el.innerHTML = `
      <div class="pr-name">${HOTEL.name}</div>
      <div class="pr-meta">${HOTEL.addr}${GST.enabled && HOTEL.gstin ? `<br>GSTIN: ${HOTEL.gstin}` : ""}</div>
      <hr>
      <div class="pr-row"><span>Table ${t.number}</span><span>${new Date().toLocaleString("en-IN")}</span></div>
      <hr>
      ${(t.cart||[]).map(c=>`<div class="pr-row"><span>${c.qty}x ${c.name}</span><span>${(c.price*c.qty).toLocaleString("en-IN")}</span></div>`).join("")}
      <hr>
      ${GST.enabled ? `
      <div class="pr-row"><span>Subtotal</span><span>${bill.subtotal.toLocaleString("en-IN")}</span></div>
      <div class="pr-row"><span>CGST ${GST.cgst}%</span><span>${bill.cgst.toLocaleString("en-IN")}</span></div>
      <div class="pr-row"><span>SGST ${GST.sgst}%</span><span>${bill.sgst.toLocaleString("en-IN")}</span></div>
      <hr>` : ""}
      <div class="pr-row pr-total"><span>TOTAL</span><span>Rs. ${bill.total.toLocaleString("en-IN")}</span></div>
      <hr>
      <div style="text-align:center;font-size:9px;">Thank you, visit again!</div>`;
    window.print();
  }

  /* ---- Admin: Menu tab ---- */
  function renderAdminMenu(){
    const body = $("#adminBody");
    const cats = categories();
    body.innerHTML = `
      <div class="section-head">
        <div><h1 style="font-size:20px;">Menu (${menuItems.length} items)</h1><p class="section-sub">Add, edit or remove items — everyone sees the change within a few seconds</p></div>
      </div>
      <div id="menuList">
        ${cats.map(cat=>`
          <div class="cat-group-title">${cat}</div>
          ${menuItems.filter(i=>i.category===cat).map(i=>`
            <div class="manage-row">
              <div class="mr-main"><div class="mr-title">${i.name} ${i.popular?'⭐':''}</div><div class="mr-sub">${money(i.price)}</div></div>
              <div class="mr-actions">
                <button class="icon-btn" data-edit="${i.id}">✎</button>
                <button class="icon-btn danger" data-del="${i.id}">✕</button>
              </div>
            </div>`).join("")}
        `).join("") || `<div class="empty-state">No menu items yet. Tap + to add your first item.</div>`}
      </div>`;
    $$("#menuList [data-edit]").forEach(b=> b.onclick = ()=> openItemForm(b.dataset.edit));
    $$("#menuList [data-del]").forEach(b=> b.onclick = async ()=>{
      const item = menuItems.find(m=>m.id===b.dataset.del);
      if(confirm("Remove \""+item.name+"\" from the menu?")){
        await tursoExec("DELETE FROM menu_items WHERE id = ?", [b.dataset.del]);
        showBanner("Item removed");
        await refreshAll();
      }
    });
    const fab = document.createElement("button");
    fab.className = "fab"; fab.id = "fabBtn"; fab.textContent = "+";
    fab.onclick = ()=> openItemForm(null);
    document.body.appendChild(fab);
  }

  const NEW_CATEGORY_VALUE = "__new__";
  function populateCategorySelect(selected){
    const cats = categories();
    const sel = $("#ifCategory");
    sel.innerHTML = cats.map(c=>`<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join("")
      + `<option value="${NEW_CATEGORY_VALUE}">+ New category…</option>`;
    if(selected && cats.includes(selected)) sel.value = selected;
    else if(cats.length) sel.value = cats[0];
  }
  function openItemForm(itemId){
    editingItemDocId = itemId;
    if(itemId){
      const it = menuItems.find(m=>m.id===itemId);
      $("#itemFormTitle").textContent = "Edit Menu Item";
      $("#ifName").value = it.name; $("#ifPrice").value = it.price;
      populateCategorySelect(it.category);
      $("#ifPopular").checked = !!it.popular;
    } else {
      $("#itemFormTitle").textContent = "Add Menu Item";
      $("#ifName").value = ""; $("#ifPrice").value = ""; $("#ifPopular").checked = false;
      populateCategorySelect(null);
    }
    $("#itemFormOverlay").classList.add("show");
  }
  $("#ifCategory").addEventListener("change", ()=>{
    const sel = $("#ifCategory");
    if(sel.value !== NEW_CATEGORY_VALUE) return;
    const existing = categories();
    let name = prompt("New category name:");
    if(name === null){ populateCategorySelect(existing[0]||null); return; }
    name = name.trim();
    if(!name){ populateCategorySelect(existing[0]||null); return; }
    const dupe = existing.find(c=> c.toLowerCase() === name.toLowerCase());
    if(dupe){ showBanner('Category "'+dupe+'" already exists — selected it for you'); populateCategorySelect(dupe); return; }
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name + " (new)";
    sel.insertBefore(opt, sel.lastElementChild);
    sel.value = name;
  });
  $("#itemFormCancel").onclick = ()=> $("#itemFormOverlay").classList.remove("show");
  $("#itemFormOverlay").addEventListener("click",(e)=>{ if(e.target.id==="itemFormOverlay") $("#itemFormOverlay").classList.remove("show"); });
  $("#itemFormSave").onclick = async ()=>{
    const name = $("#ifName").value.trim();
    const price = Number($("#ifPrice").value);
    const category = $("#ifCategory").value;
    const popular = $("#ifPopular").checked;
    if(!name || !price || price<=0 || !category || category===NEW_CATEGORY_VALUE){ alert("Please fill item name, a valid price, and pick or create a category."); return; }
    if(editingItemDocId){
      await tursoExec("UPDATE menu_items SET name=?, price=?, category=?, popular=?, updated_at=? WHERE id=?",
        [name, price, category, popular?1:0, Date.now(), editingItemDocId]);
      showBanner("Item updated");
    } else {
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") + "-" + Date.now().toString(36).slice(-4);
      await tursoExec("INSERT INTO menu_items (id, name, price, category, popular, updated_at) VALUES (?, ?, ?, ?, ?, ?)",
        [id, name, price, category, popular?1:0, Date.now()]);
      showBanner("Item added to menu");
    }
    $("#itemFormOverlay").classList.remove("show");
    await refreshAll();
  };

  /* ---- Admin: Users tab (account management) ---- */
  function renderAdminStaff(){
    const body = $("#adminBody");
    body.innerHTML = `
      <div class="section-head">
        <div><h1 style="font-size:20px;">Users</h1><p class="section-sub">Accounts that can sign in — give each person their own username &amp; password</p></div>
      </div>
      <div id="staffList">
        ${accounts.map(a=>`
          <div class="manage-row">
            <div class="mr-main">
              <div class="mr-title">${a.display_name || a.username} ${a.role==='admin' ? '👑 Admin' : a.role==='kitchen' ? '🍳 Kitchen' : ''}</div>
              <div class="mr-sub">Username: ${a.username}</div>
            </div>
            <div class="mr-actions">
              <button class="icon-btn" data-edit="${a.id}">✎</button>
              <button class="icon-btn danger" data-del="${a.id}" ${session && session.id===a.id ? 'disabled title="You cannot delete your own account while signed in"':''}>✕</button>
            </div>
          </div>`).join("") || `<div class="empty-state">No accounts yet.</div>`}
      </div>`;
    $$("#staffList [data-edit]").forEach(b=> b.onclick = ()=> openAccountForm(Number(b.dataset.edit)));
    $$("#staffList [data-del]").forEach(b=> b.onclick = async ()=>{
      const a = accounts.find(x=>x.id===Number(b.dataset.del));
      if(confirm('Remove the account "'+a.username+'"?')){
        await tursoExec("DELETE FROM accounts WHERE id = ?", [a.id]);
        showBanner("Account removed");
        await refreshAll();
      }
    });
    const fab = document.createElement("button");
    fab.className = "fab"; fab.id = "fabBtn"; fab.textContent = "+";
    fab.onclick = ()=> openAccountForm(null);
    document.body.appendChild(fab);
  }
  function openAccountForm(accountId){
    editingAccountId = accountId;
    if(accountId){
      const a = accounts.find(x=>x.id===accountId);
      $("#acctFormTitle").textContent = "Edit Account";
      $("#sfName").value = a.display_name || "";
      $("#sfUsername").value = a.username;
      $("#sfPin").value = a.password;
      $("#sfRole").value = a.role;
    } else {
      $("#acctFormTitle").textContent = "Add Account";
      $("#sfName").value = ""; $("#sfUsername").value = ""; $("#sfPin").value = ""; $("#sfRole").value = "user";
    }
    $("#staffFormOverlay").classList.add("show");
  }
  $("#staffFormCancel").onclick = ()=> $("#staffFormOverlay").classList.remove("show");
  $("#staffFormOverlay").addEventListener("click",(e)=>{ if(e.target.id==="staffFormOverlay") $("#staffFormOverlay").classList.remove("show"); });
  $("#staffFormSave").onclick = async ()=>{
    const name = $("#sfName").value.trim();
    const username = $("#sfUsername").value.trim();
    const password = $("#sfPin").value;
    const role = $("#sfRole").value;
    if(!name || !username || !password){ alert("Please fill display name, username and password."); return; }
    try{
      if(editingAccountId){
        await tursoExec("UPDATE accounts SET display_name=?, username=?, password=?, role=? WHERE id=?",
          [name, username, password, role, editingAccountId]);
        if(session && session.id===editingAccountId){
          session = { id: editingAccountId, username, role, displayName: name };
          localStorage.setItem("nt_session", JSON.stringify(session));
          updateTopbarForSession();
        }
        showBanner("Account updated");
      } else {
        await tursoExec("INSERT INTO accounts (username, password, role, display_name) VALUES (?, ?, ?, ?)",
          [username, password, role, name]);
        showBanner("Account created");
      }
      $("#staffFormOverlay").classList.remove("show");
      await refreshAll();
    }catch(e){
      alert("Could not save: that username may already be taken.");
    }
  };

  /* ---------------- Boot ---------------- */
  updateTopbarForSession();
  boot();
})();
</script>
</body>
</html>
